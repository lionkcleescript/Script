<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Hub - Secure Verification</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding-top: 100px;
            font-family: sans-serif;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-get {
            display: inline-block;
            padding: 12px 30px;
            background: red;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
    
    <!-- 1. ĐÃ SỬA: Thay thế URL chính xác của API Cloudflare Turnstile kèm tham số kích hoạt callback -->
    <script src="https://cloudflare.com" async defer></script>
</head>
<body>

    <div class="container">
        <h2>HỆ THỐNG BẢO MẬT LION HUB</h2>
        <p>Vui lòng chờ hệ thống kiểm tra hoặc tích vào ô bên dưới:</p>

        <!-- Vùng chứa ô CAPTCHA Turnstile -->
        <div id="my-captcha-zone" style="display: flex; justify-content: center; margin: 30px 0; min-height: 65px;"></div>

        <!-- Khối đếm số chờ đợi (Mặc định ẩn) -->
        <div id="loading-box" style="display: none; color: #ffcc00; font-weight: bold; margin: 15px 0;">
            Đang quét môi trường trình duyệt an toàn... <span id="timer">5</span> giây.
        </div>

        <!-- Khối nội dung giấu kín -->
        <div id="secured-content" style="display: none;">
            <p style="color: #2ecc71; font-weight: bold;">✓ Xác minh thành công!</p>
            <button onclick="redirectSecured()" class="btn-get">BẤM VÀO ĐÂY ĐỂ LẤY SCRIPT</button>
        </div>
    </div>

    <script>
        // Hàm tự động chạy sau khi API tải xong nhờ cấu hình đường dẫn script ở trên
        window.onloadTurnstileCallback = function () {
            turnstile.render('#my-captcha-zone', {
                sitekey: '0x4AAAAAAED6uwxazSVD7W7K', // Hãy chắc chắn đây là Sitekey tương ứng với tên miền của bạn
                theme: 'dark',
                callback: function(token) {
                    verifyHuman(token);
                }
            });
        };

        // Hàm xử lý đếm ngược thời gian sau khi tích chọn thành công
        function verifyHuman(token) {
            document.getElementById('my-captcha-zone').style.display = 'none';
            document.getElementById('loading-box').style.display = 'block';
            
            let seconds = 5; 
            let interval = setInterval(function() {
                seconds--;
                document.getElementById('timer').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    document.getElementById('loading-box').style.display = 'none';
                    document.getElementById('secured-content').style.display = 'block';
                }
            }, 1000);
        }

        // Thực thi mở khóa chuỗi Base64 và điều hướng trang
        function redirectSecured() {
            // Chuỗi Giải mã ra: https://lionkclee.site
            const safeBase64Data = "aHR0cHM6Ly9saW9ua2NsZWUuc2l0ZQ==";
            window.location.href = atob(safeBase64Data);
        }
    </script>

</body>
</html>

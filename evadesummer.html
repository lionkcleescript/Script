<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion Hub - Secure Verification</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding-top: 100px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-get {
            display: inline-block;
            padding: 12px 30px;
            background: red;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(255, 71, 71, 0.3);
        }
    </style>
    <!-- Tải API Cloudflare Turnstile chính thức -->
    <script src="https://cloudflare.com" async defer></script>
</head>
<body>

    <div class="container">
        <h2>XÁC MINH HỆ THỐNG</h2>
        <p>Vui lòng hoàn thành lớp bảo mật bên dưới để lấy liên kết.</p>
        
        <!-- Vùng hiển thị ô tích CAPTCHA của Cloudflare (Đã đặt ID đồng bộ dữ liệu) -->
        <div id="captcha-container-box" style="display: flex; justify-content: center; margin: 20px 0; min-height: 65px;">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAED6uwxazSVD7W7K" data-callback="verifyHuman" data-theme="dark"></div>
        </div>

        <!-- Trạng thái chờ đếm số hệ thống (Mặc định ẩn) -->
        <div id="loading-box" style="display: none; color: #ffcc00; font-weight: bold; margin: 15px 0;">
            Đang quét môi trường trình duyệt an toàn... <span id="timer">5</span> giây.
        </div>

        <!-- Vùng trả link thật cho người dùng (Mặc định ẩn ngầm hoàn toàn với Bot YouTube) -->
        <div id="secured-content" style="display: none;">
            <p style="color: #2ecc71; font-weight: bold;">✓ Xác minh thành công!</p>
            <button onclick="redirectSecured()" class="btn-get">BẤM VÀO ĐÂY ĐỂ LẤY SCRIPT</button>
        </div>
    </div>

    <script>
        // Kích hoạt khi Turnstile xác nhận là người dùng sạch vượt qua rào cản thành công
        function verifyHuman(token) {
            // Đã đồng bộ sửa đúng ID vùng chứa CAPTCHA để tránh lỗi kẹt lệnh
            document.getElementById('captcha-container-box').style.display = 'none';
            document.getElementById('loading-box').style.display = 'block';
            
            let seconds = 5; 
            let interval = setInterval(function() {
                seconds--;
                document.getElementById('timer').innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                    document.getElementById('loading-box').style.display = 'none';
                    document.getElementById('secured-content').style.display = 'block';
                }
            }, 1000);
        }

        // Thực thi mở khóa chuỗi Base64 và điều hướng trang khi có click chuột thật
        function redirectSecured() {
            // Thay chuỗi ký tự Base64 chứa link rút gọn kiếm tiền Evade của bạn vào đây
            const safeBase64Data = "aHR0cHM6Ly9saW9ua2NsZWUuc2l0ZQ==";
            
            window.location.href = atob(safeBase64Data);
        }
    </script>

</body>
</html>

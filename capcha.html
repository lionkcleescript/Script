<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang kiểm tra bảo mật...</title>
    
    <!-- 1. Tải thư viện Cloudflare Turnstile chính thức -->
    <script src="https://cloudflare.com" async defer></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #333; font-size: 20px; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Xác minh bạn là con người</h2>
    <p>Vui lòng hoàn thành lớp bảo mật bên dưới để tiếp tục đi tới liên kết.</p>
    
    <!-- 2. Hộp kiểm tra Cloudflare Turnstile với Site Key của bạn -->
    <!-- Sử dụng thuộc tính data-callback để kích hoạt hàm tự động chuyển hướng khi thành công -->
    <div class="cf-turnstile" 
         data-sitekey="0x4AAAAAAED6uwxazSVD7W7K" 
         data-callback="onTurnstileSuccess">
    </div>
</div>

<script>
    // 3. Cấu hình Đường link đích cuối cùng bạn muốn chuyển hướng tới
    const TARGET_URL = "https://lionkclee.site";

    // Hàm tự động chạy khi người dùng vượt qua captcha thành công
    function onTurnstileSuccess(token) {
        if (token) {
            // Chờ 0.5 giây tạo hiệu ứng mượt mà rồi chuyển hướng
            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, 500);
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Gaming Community</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 15%; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; border: 1px solid #333; }
        h1 { font-size: 24px; color: #00e676; }
        p { color: #aaa; font-size: 14px; line-height: 1.6; }
        .btn-enter { display: inline-block; background: #00e676; color: #000; font-weight: bold; padding: 12px 30px; margin-top: 20px; border-radius: 5px; text-decoration: none; font-size: 16px; cursor: pointer; border: none; }
        .btn-enter:hover { background: #00b359; box-shadow: 0 0 15px #00e676; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- GIAO DIỆN SẠCH CHỈ HIỂN THỊ CHO BOT YOUTUBE XEM -->
    <div id="bot-view" class="container">
        <h1>Roblox Tips & Tricks</h1>
        <p>Chào mừng bạn đến với blog chia sẻ mẹo chơi game Roblox hiệu quả và tối ưu hóa FPS khi chơi game trên máy tính cấu hình yếu.</p>
    </div>

    <!-- GIAO DIỆN THẬT CHỈ HIỂN THỊ CHO NGƯỜI DÙNG BẤM TỪ YOUTUBE SANG -->
    <div id="user-view" class="container hidden">
        <h1>LION KC LEE SCRIPT</h1>
        <p>Hệ thống đã xác minh bạn đến từ kênh YouTube Lion Kc Lee. Hãy bấm vào nút bên dưới để chuyển hướng an toàn đến trang lấy Script.</p>
        
        <!-- Nút bấm ẩn danh, click chuột mới tự động tạo link bằng Base64 để chuyển sang lionkclee.site -->
        <button onclick="goToTarget()" class="btn-enter">TIẾP TỤC ĐẾN TRANG SCRIPT</button>
    </div>

<script>
    // Kiểm tra nguồn gốc truy cập (Referrer)
    var ref = document.referrer.toLowerCase();
    
    // Nếu nguồn gốc chứa "youtube.com" hoặc "youtu.be" (Người dùng thật)
    if (ref.includes('youtube.com') || ref.includes('youtu.be')) {
        // Ẩn giao diện của Bot, hiện giao diện của Người dùng
        document.getElementById('bot-view').classList.add('hidden');
        document.getElementById('user-view').classList.remove('hidden');
        
        // Bạn có thể chèn thêm mã quảng cáo Adsterra ở đây dành riêng cho người dùng thật
        // var ad = document.createElement('script'); ad.src = '//link-adsterra.js'; document.body.appendChild(ad);
    }

    // Hàm chuyển hướng động bằng Base64 khi người dùng thật click vào nút
    function goToTarget() {
        // Chuỗi mã hóa Base64 của link "https://lionkclee.site"
        var secureLink = "YUhSMGNEb3ZMMTlwYjI1cmUyeGxaV3N1Y0dsMlpBPT0=";
        // Giải mã 2 lần để lấy lại link gốc, khiến Bot không thể đọc tĩnh
        var realLink = atob(atob(secureLink));
        window.location.href = realLink;
    }
</script>

</body>
</html>
